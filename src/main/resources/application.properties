spring.application.name=BookPass


# JWT Configuration (reads from environment variable, no default = required)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000



spring.datasource.url=jdbc:postgresql://bookpass.postgres.database.azure.com:5432/bookpass_db
spring.datasource.username=${DB_USERNAME:bookpass}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.ssl=true


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.docker.compose.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# Moyasar Configuration (reads from environment variable)
moyasar.secret-key=${MOYASAR_SECRET_KEY}

# Resend Configuration
resend.api.key=${RESEND_API_KEY}