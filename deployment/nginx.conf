# =====================================================
# BookPass API - Nginx Reverse Proxy Configuration
# =====================================================
# Add this to your existing nginx configuration on Hetzner
# Path: /etc/nginx/sites-available/bookpass-api
# =====================================================

# Upstream for BookPass backend
upstream bookpass_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.book-pass.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.book-pass.com;

    # SSL Configuration (adjust paths to your certificates)
    # If using Certbot, these are typically auto-configured
    ssl_certificate /etc/letsencrypt/live/api.book-pass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.book-pass.com/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS Headers (adjust origins as needed)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Max-Age 86400 always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Logging
    access_log /var/log/nginx/bookpass-api.access.log;
    error_log /var/log/nginx/bookpass-api.error.log;

    # Max upload size (match Spring Boot settings)
    client_max_body_size 10M;

    # Proxy to BookPass backend
    location / {
        proxy_pass http://bookpass_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (optional - for monitoring)
    location /health {
        proxy_pass http://bookpass_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
